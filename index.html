<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Health AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(59,130,246,0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* APP */
        .container {
            width: 420px;
            max-height: 92vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* HEADER */
        .header {
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
        }

        /* CHAT */
        .chat-box {
            display: none;
            height: 250px;
            overflow-y: auto;
            padding: 12px;
            background: #f8fafc;
        }

        /* SCROLLBAR */
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* MESSAGE WRAPPER */
        .msg-wrap {
            display: flex;
            margin: 6px 0;
        }

        .msg-wrap.user { justify-content: flex-end; }
        .msg-wrap.bot { justify-content: flex-start; }

        /* BUBBLE */
        .bubble {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            position: relative;
            animation: fadeIn 0.2s ease;
        }

        /* USER */
        .bubble.user {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 6px;
        }

        /* BOT */
        .bubble.bot {
            background: #e2e8f0;
            border-bottom-left-radius: 6px;
        }

        /* TIME */
        .meta {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.6;
            text-align: right;
        }

        /* TYPING */
        .typing span {
            display: inline-block;
            width: 5px;
            height: 5px;
            margin: 2px;
            background: #64748b;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%,100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        @keyframes fadeIn {
            from {opacity:0; transform:translateY(5px);}
            to {opacity:1;}
        }

        /* INPUT */
        .input-area {
            padding: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
        }

        /* BUTTONS */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            padding: 10px;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .chat-btn { background: #2563eb; }
        .analyze-btn { background: #0ea5e9; }
        .history-btn { background: #16a34a; }
        .clear-btn { background: #dc2626; }

        /* RESULTS */
        .results, .history {
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .card {
            padding: 10px;
            margin-top: 8px;
            border-radius: 10px;
            border-left: 5px solid;
        }

        .low { background: #ecfdf5; border-color: #22c55e; }
        .medium { background: #fff7ed; border-color: #f59e0b; }
        .high { background: #fef2f2; border-color: #ef4444; }

        .ai-box {
            display: none;
            margin: 10px;
            padding: 10px;
            background: #eff6ff;
            border-left: 5px solid #2563eb;
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">🩺 Smart Health AI</div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
        <input id="inputMsg" placeholder="Describe symptoms..." />

        <div class="btn-group">
            <button class="chat-btn" onclick="sendMessage()">Chat</button>
            <button class="analyze-btn" onclick="analyze()">Analyze</button>
            <button class="history-btn" onclick="loadHistory()">History</button>
            <button class="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
    </div>

    <div id="result" class="results"></div>
    <div id="aiResult" class="ai-box"></div>
    <div id="history" class="history"></div>

</div>

<script>
    let chatHistory = [];
    let typingEl = null;

    function timeNow() {
        return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function addMessage(text, type) {
        const chatBox = document.getElementById("chatBox");
        chatBox.style.display = "block";

        const wrap = document.createElement("div");
        wrap.className = "msg-wrap " + type;

        const bubble = document.createElement("div");
        bubble.className = "bubble " + type;

        bubble.innerHTML = text + `<div class="meta">${timeNow()}</div>`;

        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
        const chatBox = document.getElementById("chatBox");

        const wrap = document.createElement("div");
        wrap.className = "msg-wrap bot";

        const bubble = document.createElement("div");
        bubble.className = "bubble bot";

        bubble.innerHTML = `<div class="typing">
            <span></span><span></span><span></span>
        </div>`;

        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);

        typingEl = wrap;
    }

    function removeTyping() {
        if (typingEl) typingEl.remove();
    }

    async function sendMessage() {
        const input = document.getElementById("inputMsg");
        const msg = input.value.trim();
        if (!msg) return;

        addMessage(msg, "user");
        chatHistory.push(msg);
        input.value = "";

        showTyping();

        try {
            const res = await fetch("http://localhost:8080/api/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(chatHistory)
            });

            const reply = await res.text();
            removeTyping();
            addMessage(reply, "bot");

        } catch {
            removeTyping();
            addMessage("Server error", "bot");
        }
    }

    async function analyze() {
        const symptoms = document.getElementById("inputMsg").value.trim();
        if (!symptoms) return alert("Enter symptoms");

        const res = await fetch("http://localhost:8080/api/analyze?symptoms=" + encodeURIComponent(symptoms));
        const data = await res.json();

        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "";

        data.predictions.forEach(p => {
            resultDiv.innerHTML += `
                <div class="card ${p.risk.toLowerCase()}">
                    <b>${p.condition}</b><br>
                    Risk: ${p.risk}<br>
                    Confidence: ${p.confidence}%
                </div>
            `;
        });
    }

    async function loadHistory() {
        const res = await fetch("http://localhost:8080/api/history");
        const data = await res.json();

        const historyDiv = document.getElementById("history");
        historyDiv.innerHTML = "<b>History</b>";

        data.reverse().forEach(item => {
            historyDiv.innerHTML += `<div class="card">${item.symptoms}</div>`;
        });
    }

    async function clearHistory() {
        if (!confirm("Delete all history?")) return;
        await fetch("http://localhost:8080/api/history", { method: "DELETE" });
        document.getElementById("history").innerHTML = "";
    }
</script>

</body>
</html>
